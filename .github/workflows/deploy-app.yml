name: Deploy app (std-kflow on Cloud Run)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  REGION: europe-west4
  SERVICE: kflow-app
  IMAGE: europe-west4-docker.pkg.dev/kflow-b3a39/kflow/kflow-app

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push the image
        run: |
          gcloud auth configure-docker europe-west4-docker.pkg.dev --quiet
          printf '%s' "$NODE_AUTH_TOKEN" > /tmp/node_auth_token
          docker build --secret id=node_auth_token,src=/tmp/node_auth_token -t "$IMAGE:$GITHUB_SHA" .
          docker push "$IMAGE:$GITHUB_SHA"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" --image "$IMAGE:$GITHUB_SHA" --region "$REGION" --project kflow-b3a39 \
            --memory 6Gi --cpu 2 --min-instances 1 --max-instances 3 --port 8080 --allow-unauthenticated \
            --set-env-vars "NODE_ENV=production,AUTH_PROVIDER=firebase,FIREBASE_PROJECT_ID=kflow-b3a39,CORS_ORIGIN=https://kflow.academy" \
            --set-secrets "FIREBASE_SERVICE_ACCOUNT=kflow-firebase-service-account:latest,OPEN_ROUTER_API_KEY=kflow-openrouter-key:latest,OPENAI_API_KEY=kflow-openai-key:latest,DEEPSEEK_API_KEY=kflow-deepseek-key:latest,EMBEDDING_API_KEY=kflow-embedding-key:latest,ALMADAR_API_KEY_SALT=kflow-api-key-salt:latest"

      - name: Cleanup credentials
        if: always()
        run: rm -f /tmp/node_auth_token
