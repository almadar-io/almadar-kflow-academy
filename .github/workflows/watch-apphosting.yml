name: Roll out and watch App Hosting

# A v* tag ships kflow-academy-server: this run rolls out the tagged commit through App Hosting
# (automatic rollouts from main are off) and goes red when its build or rollout
# fails, which is what emails the owner. A push to main publishes nothing.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  watch:
    name: kflow-academy-server ships this tag
    runs-on: ${{ vars.ALMADAR_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verdict tests
        run: node --test scripts/watch-apphosting.test.mjs
      - name: Roll out the tagged commit
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          sa="$RUNNER_TEMP/firebase-sa.json"
          trap 'rm -f "$sa"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$sa"
          GOOGLE_APPLICATION_CREDENTIALS="$sa" npx -y firebase-tools@15.30.1 apphosting:rollouts:create kflow-academy-server --git-commit "$GITHUB_SHA" --force --project kflow-b3a39
      - name: Wait for build + rollout
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APPHOSTING_BACKEND: kflow-academy-server
        run: node scripts/watch-apphosting.mjs
